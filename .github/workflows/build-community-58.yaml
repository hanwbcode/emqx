name: Build and Publish Community 5.8 Image

on:
  push:
    branches:
      - release-58
  workflow_dispatch:
    inputs:
      sync_upstream:
        description: '是否在构建前同步上游 upstream/release-58 最新提交'
        required: true
        type: boolean
        default: true
  schedule:
    # 每天 UTC 02:00（北京时间 10:00）自动检查上游是否有更新并构建
    - cron: '0 2 * * *'

permissions:
  contents: write
  packages: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, 'pushdocker'))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: release-58
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync with Upstream
        id: sync
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git remote add upstream https://github.com/emqx/emqx.git || true
          git fetch upstream release-58
          
          LOCAL_HASH=$(git rev-parse HEAD)
          UPSTREAM_HASH=$(git rev-parse upstream/release-58)
          
          echo "Local SHA:    $LOCAL_HASH"
          echo "Upstream SHA: $UPSTREAM_HASH"
          
          SHOULD_SYNC="${{ github.event.inputs.sync_upstream }}"
          IS_SCHEDULE="${{ github.event_name == 'schedule' }}"
          IS_PUSH="${{ github.event_name == 'push' }}"
          
          if [ "$LOCAL_HASH" != "$UPSTREAM_HASH" ] && { [ "$IS_SCHEDULE" = "true" ] || [ "$SHOULD_SYNC" = "true" ]; }; then
            echo "发现上游 release-58 有更新，正在同步..."
            git merge --no-edit upstream/release-58
            git push origin release-58
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$IS_PUSH" = "true" ]; then
            echo "触发构建，继续执行..."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "代码已是最新，定时检查跳过构建。"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.sync.outputs.has_changes == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (ghcr.io)
        if: steps.sync.outputs.has_changes == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Community Docker Image
        if: steps.sync.outputs.has_changes == 'true'
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/${OWNER_LOWER}/emqx"
          SHORT_SHA=$(git rev-parse --short HEAD)
          
          echo "Building Community Edition (PROFILE=emqx) for commit: ${SHORT_SHA}"
          echo "Target image: ${IMAGE_NAME}:5.8-latest and ${IMAGE_NAME}:5.8-${SHORT_SHA}"
          
          docker build \
            --build-arg PROFILE=emqx \
            -t "${IMAGE_NAME}:5.8-latest" \
            -t "${IMAGE_NAME}:5.8-${SHORT_SHA}" \
            -f deploy/docker/Dockerfile .
            
          docker push "${IMAGE_NAME}:5.8-latest"
          docker push "${IMAGE_NAME}:5.8-${SHORT_SHA}"
          
          echo "=========================================================="
          echo "构建并推送成功！"
          echo "拉取命令: docker pull ${IMAGE_NAME}:5.8-latest"
          echo "=========================================================="
